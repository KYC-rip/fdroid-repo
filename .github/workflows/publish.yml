name: Publish F-Droid Repository

on:
  workflow_dispatch:
  repository_dispatch:
    types: [app-release]
  schedule:
    - cron: '0 */6 * * *'

concurrency:
  group: fdroid-kyc-rip-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - name: Checkout fdroid-repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install fdroidserver (latest), JDK, and Android tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            openjdk-21-jdk-headless \
            apksigner \
            aapt \
            python3-venv \
            rsync
          python3 -m venv "${RUNNER_TEMP}/fdroid-venv"
          "${RUNNER_TEMP}/fdroid-venv/bin/pip" install --upgrade pip fdroidserver qrcode
          echo "${RUNNER_TEMP}/fdroid-venv/bin" >> "$GITHUB_PATH"
          "${RUNNER_TEMP}/fdroid-venv/bin/fdroid" --version
          aws --version

      - name: Pull existing repo/ from Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          mkdir -p repo
          aws s3 sync "s3://${R2_BUCKET}/repo/" repo/ \
            --endpoint-url "${R2_ENDPOINT}" \
            --only-show-errors || true

      - name: Sync signed APKs and metadata from GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I scripts/sync_apps.py

      - name: Configure fdroidserver and sign index
        env:
          FDROID_KEYSTORE_BASE64: ${{ secrets.FDROID_KEYSTORE_BASE64 }}
          FDROID_KEYSTORE_PASS: ${{ secrets.FDROID_KEYSTORE_PASS }}
          FDROID_KEY_ALIAS: ${{ secrets.FDROID_KEY_ALIAS }}
          FDROID_KEY_PASS: ${{ secrets.FDROID_KEY_PASS }}
        run: |
          set -euo pipefail
          KS_PATH="${RUNNER_TEMP}/fdroid-repo.keystore"
          printf '%s' "$FDROID_KEYSTORE_BASE64" | base64 -d > "$KS_PATH"
          chmod 600 "$KS_PATH"

          python3 - "$KS_PATH" <<'PY'
          import os, pathlib, sys
          tpl = pathlib.Path("config.yml.template").read_text(encoding="utf-8")
          out = (
              tpl.replace("__KEYSTORE_PATH__", sys.argv[1])
                 .replace("__KEY_ALIAS__", os.environ["FDROID_KEY_ALIAS"])
                 .replace("__KEYSTORE_PASS__", os.environ["FDROID_KEYSTORE_PASS"])
                 .replace("__KEY_PASS__", os.environ["FDROID_KEY_PASS"])
          )
          pathlib.Path("config.yml").write_text(out, encoding="utf-8")
          os.chmod("config.yml", 0o600)
          PY

          fdroid update --create-metadata --verbose
          test -s repo/index-v2.json
          test -s repo/entry.jar

          # Ensure every icon/graphic path referenced by index-v2.json exists on disk
          # (fdroidserver sometimes leaves Fastlane icon.png unrenamed while index-v2.json
          # references icon_<urlsafe-b64-sha256>.png). Verify exact sha256 match.
          python3 - <<'PY'
          import hashlib, json, pathlib, shutil

          repo = pathlib.Path("repo")
          idx = json.loads((repo / "index-v2.json").read_text(encoding="utf-8"))

          def sha256(p: pathlib.Path) -> str:
              return hashlib.sha256(p.read_bytes()).hexdigest()

          def ensure_file(entry: dict) -> None:
              if not isinstance(entry, dict) or not entry.get("name"):
                  return
              rel = entry["name"].lstrip("/")
              target = repo / rel
              if target.is_file():
                  return
              want_sha = entry.get("sha256")
              # Look in the same directory for a sibling file with the exact sha256 (e.g. icon.png)
              if target.parent.is_dir():
                  for cand in target.parent.iterdir():
                      if cand.is_file() and (not want_sha or sha256(cand) == want_sha):
                          shutil.copy2(cand, target)
                          print(f"[fix-asset] materialized {rel} from {cand.name}")
                          return
              raise SystemExit(f"Missing repo asset referenced by index-v2.json: {rel}")

          for pkg in (idx.get("packages") or {}).values():
              meta = pkg.get("metadata") or {}
              for field in ("icon", "featureGraphic", "promoGraphic", "tvBanner"):
                  val = meta.get(field)
                  if isinstance(val, dict):
                      for loc_entry in val.values():
                          ensure_file(loc_entry)
              for ss_group in (meta.get("screenshots") or {}).values():
                  if isinstance(ss_group, dict):
                      for items in ss_group.values():
                          if isinstance(items, list):
                              for item in items:
                                  ensure_file(item)
          print("[ok] all index-v2.json graphic assets verified on disk")
          PY

          FP=$(keytool -list -v -keystore "$KS_PATH" -storepass "$FDROID_KEYSTORE_PASS" -alias "$FDROID_KEY_ALIAS" \
            | awk '/SHA256:/ {gsub(/:/, "", $2); print $2; exit}')
          echo "FINGERPRINT=${FP}" >> "$GITHUB_ENV"
          echo "Repo SHA-256 fingerprint: ${FP}"

      - name: Build fdroid.kyc.rip landing page
        run: |
          "${RUNNER_TEMP}/fdroid-venv/bin/python" -I scripts/build_landing.py --fingerprint "$FINGERPRINT"

      - name: Upload repo/ and index.html to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          # Phase 1: upload new APKs and assets before overwriting indexes so clients never hit 404.
          aws s3 sync repo/ "s3://${R2_BUCKET}/repo/" \
            --endpoint-url "${R2_ENDPOINT}" \
            --exclude "index-v*" --exclude "entry.*" \
            --only-show-errors
          # Phase 2: upload signed indexes and prune stale APKs.
          aws s3 sync repo/ "s3://${R2_BUCKET}/repo/" \
            --endpoint-url "${R2_ENDPOINT}" \
            --delete \
            --only-show-errors
          # Phase 3: upload landing page.
          aws s3 cp public/index.html "s3://${R2_BUCKET}/index.html" \
            --endpoint-url "${R2_ENDPOINT}" \
            --content-type "text/html; charset=utf-8" \
            --only-show-errors

      - name: Scrub temporary signing files
        if: always()
        run: rm -f "${RUNNER_TEMP}/fdroid-repo.keystore" config.yml
